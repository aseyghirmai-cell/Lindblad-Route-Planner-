<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · Lindblad Route Planner Cloud</title>
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <header>
        <span class="eyebrow">ENTERPRISE 1.0</span>
        <h1 id="loginTitle">Lindblad Route Planner Cloud</h1>
        <p>Secure organization workspace</p>
      </header>
      <form id="loginForm">
        <label><span>Username</span><input id="username" name="username" autocomplete="username" required autofocus></label>
        <label><span>Password</span><input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button id="loginButton" type="submit">Sign in</button>
        <div id="loginMessage" class="message" role="alert" aria-live="polite"></div>
      </form>
      <footer>Access is restricted to authorized users. Uploads and route data are stored in your organization’s private server workspace.</footer>
    </section>
  </main>
  <script src="/login.js"></script>
</body>
</html>
